<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a22">
  <title>Spider vs Human: Дело №13</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E🕷%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section id="loading" class="screen loading-screen" aria-label="Загрузка главной страницы" aria-busy="true">
    <header class="eyebrow">SPIDER VS HUMAN <span>•</span> НОЧНАЯ СМЕНА</header>
    <div class="loading-art"></div>
    <div class="load-bottom"></div>
  </section>
  <main id="menu" class="screen menu-screen" aria-label="Главное меню" hidden>
    <div class="menu-grain"></div>
    <header class="menu-header"><span>ДОМАШНИЙ ХАОС / EP. 01</span><div class="icon-actions"><button class="icon-button sound-toggle" aria-label="Выключить звук" aria-pressed="false"></button><button class="icon-button fullscreen" aria-label="Полный экран"></button></div></header>
    <div class="menu-title"><p>МАЛЕНЬКИЙ ПАУК. БОЛЬШИЕ ПРОБЛЕМЫ.</p><h1 class="sr-only">Spider vs Human</h1><img src="./glavnaya assets/characters/logo_vs.png" class="menu-logo" alt="Spider vs Human"></div>
    <img class="menu-spider" src="./glavnaya assets/characters/spider_hero_clean.png" alt="Каракурт">
    <img class="menu-human" src="./glavnaya assets/characters/human_panic_comic.png" alt="Испуганный разработчик">
    <img class="menu-fly" src="./glavnaya assets/characters/fly_comic.png" alt="">
    <img class="motion-lines" src="./glavnaya assets/ui/motion_lines.png" alt="">
    <div class="versus-label spider-label"><img src="./glavnaya assets/ui/nameplate_spider.png" alt="Каракурт"></div>
    <div class="versus-label human-label"><img src="./glavnaya assets/ui/nameplate_human.png" alt="Разработчик"></div>
    <nav class="menu-nav" aria-label="Действия">
      <button id="play" class="asset-button play-button" aria-label="Играть"></button>
      <button id="resume-run" class="comic-button compact" hidden>Продолжить дело</button>
      <button id="howto" class="asset-button howto-button" aria-label="Как играть"></button>
      <button id="settings" class="asset-button settings-button" aria-label="Настройки"></button>
      <button id="menu-gallery" class="comic-button compact">Галерея концовок</button>
      <button id="secret-epilogue" class="comic-button compact" hidden>Дело №13: эпилог</button>
      <p id="case-progress" class="menu-note">ДЕЛО №13 · Концовки 0/22 · Пятна 0/13</p>
    </nav>
    <div class="case-badge"><img src="./ui/logo/badge_case13.png" alt="Дело №13"><span id="spot-badge">● ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○</span></div>
    <footer class="menu-footer"><span>SPIDER VS HUMAN · ДЕЛО №13</span><span>ОДНА НОЧЬ · ДВЕ СТОРОНЫ</span></footer>
    <p id="menu-status" class="menu-status" role="status" hidden></p>
  </main>
  <section id="comic" class="comic-root" aria-label="Дело №13" hidden><div id="stage"><div id="comic-content"></div><div id="comic-hud" hidden></div><div id="comic-overlay" hidden></div><div id="comic-toast" role="status" hidden></div></div></section>
  <div id="modal" class="modal-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button id="dialog-close" class="close" aria-label="Закрыть">×</button><span class="eyebrow">SPIDER VS HUMAN</span><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions"></div></section></div>
  <div id="fatal" class="fatal" role="alert" hidden></div>
  <noscript>Для загрузки главной страницы включи JavaScript в браузере.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
